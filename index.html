    <!--
    Security notes:
    - This is a fully static site (no backend, no database, no forms submitting data).
      GitHub Pages serves static files only and cannot set custom HTTP response headers,
      so the CSP below is delivered via <meta> as a best-effort mitigation. Directives that
      only work as real HTTP headers (e.g. frame-ancestors, X-Frame-Options) CANNOT be
      enforced this way and are intentionally omitted rather than included as false security.
    - script-src 'self' blocks any inline/third-party script injection; style-src allows
      'unsafe-inline' because Angular writes some inline styles at runtime.
  -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"/>
